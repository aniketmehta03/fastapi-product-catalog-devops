version: "3.9"

services:
  mongo-db:
    image: mongo:7
    container_name: mongo
    env_file:
      - mongo.env
    volumes:
      - mongodata:/data/db
    networks:
      - app-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend-product-api
    env_file:
      - backend.env
    depends_on:
      - mongo-db
    ports:
      - "8000:8000"
    networks:
      - app-network
    volumes:
      - .:/app

networks:
  app-network:

volumes:
  mongodata:
