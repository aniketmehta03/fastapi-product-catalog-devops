apiVersion: v1
kind: Secret
metadata:
  name: {{ include "product-api.fullname" . }}-mongo-secret
  labels:
    {{- include "product-api.labels" . | nindent 4 }}
type: Opaque
data:
  MONGO_INITDB_ROOT_USERNAME: {{ .Values.mongo.username | b64enc | quote }}
  MONGO_INITDB_ROOT_PASSWORD: {{ .Values.mongo.password | b64enc | quote }}
  MONGO_INITDB_DATABASE: {{ .Values.mongo.database | b64enc | quote }}